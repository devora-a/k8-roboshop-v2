apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: roboshop
  labels:
    project: roboshop
    component: redis   # headless service is used for statefulset to create a stable network identity for each pod
    tier: db
spec:
  selector:
    project: roboshop
    tier: db
    component: redis
  ports:
  - protocol: TCP
    port: 6379 # service port
    targetPort: 6379 # container port
  clusterIP: None  # headless service
  selector:
    project: roboshop
    component: redis
    tier: db
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis       #service is used for external access to the redis statefulset
    tier: db
spec:
  ports:
  - protocol: TCP
    port: 6379 # service port
    targetPort: 6379 # container port
  selector:
    project: roboshop
    component: redis
    tier: db
---    
apiVersion: apps/v1
kind: StatefulSet    #statefulset is used to manage the redis pods and provide stable network identity and persistent storage
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    tier: db
spec:
  selector:
    matchLabels:
      project: roboshop     #statefulset uses this selector to identify the pods it manages
      component: redis
      tier: db
  serviceName: "redis-headless"
  replicas: 1
  template:
    metadata:
      labels:
        project: roboshop
        component: redis
        tier: db
    spec:
      containers:
      - name: redis
        image: redis:7
        volumeMounts:
        - name: redis
          mountPath: /data

  # PVC
  volumeClaimTemplates:
  - metadata:
      name: redis
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi        